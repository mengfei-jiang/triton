name: Publish amd-triton to PyPI

on:
  push:
    tags:
      # Final release: v3.9.0
      - v[0-9]+.[0-9]+.[0-9]+
      # Dev release: v3.9.0.dev20261031
      - v[0-9]+.[0-9]+.[0-9]+.dev*
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'devrelease'
        type: choice
        options:
          - release
          - devrelease

permissions: read-all

env:
  DOCKER_IMAGE: pytorch/manylinux2_28-builder:rocm7.2
  BUILD_ROOT: /mnt/raid0/mejiang/amd-triton-build

jobs:

  validate-tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract and validate version from tag
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python3 -c "
          import re
          with open('python/triton/__init__.py') as f:
              for line in f:
                  m = re.match(r\"^__version__\s*=\s*['\\\"]([^'\\\"]+)['\\\"]\", line)
                  if m:
                      print(m.group(1))
                      break
          ")
          echo "Tag version: $TAG_VERSION"
          echo "Package base version: $PKG_VERSION"
          if [[ "$TAG_VERSION" != "$PKG_VERSION"* ]]; then
            echo "ERROR: Tag $TAG_VERSION does not match package version $PKG_VERSION"
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: [validate-tag]
    if: always() && (needs.validate-tag.result == 'success' || needs.validate-tag.result == 'skipped')
    runs-on: self-hosted
    timeout-minutes: 240

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull build image
        run: docker pull "${DOCKER_IMAGE}"

      - name: Build wheel (Python ${{ matrix.python-version }})
        run: |
          mkdir -p "${BUILD_ROOT}/wheelhouse"
          docker rm -f amd-triton-build-${{ matrix.python-version }} 2>/dev/null || true

          docker run --rm --network=host --user root \
            -v "${GITHUB_WORKSPACE}:/triton" \
            -v "${BUILD_ROOT}:/build" \
            --ipc=host --shm-size 16g \
            -w /triton \
            -e TRITON_WHEEL_NAME=amd-triton \
            -e AMT_PACKAGE_VERSION_OVERRIDE='${{ steps.version.outputs.version }}' \
            -e AMT_RELEASE_TYPE='${{ inputs.release_type || 'release' }}' \
            -e MAX_JOBS=4 \
            -e TRITON_BUILD_WITH_CLANG_LLD=1 \
            --name amd-triton-build-${{ matrix.python-version }} \
            "${DOCKER_IMAGE}" \
            bash -c "
              conda create -n build python=${{ matrix.python-version }} -y
              eval \"\$(conda shell.bash hook)\"
              conda activate build
              pip wheel . --no-deps --wheel-dir /build/wheelhouse
            "

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-py${{ matrix.python-version }}
          path: ${{ env.BUILD_ROOT }}/wheelhouse/*.whl

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist/
          merge-multiple: true

      - name: Validate and list wheels
        run: |
          pip install twine
          twine check dist/*.whl
          echo "Wheels to publish:"
          ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
